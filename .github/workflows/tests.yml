name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[cma,test]"
      - name: download data over HTTP (pinned commits, SHA-256)
        run: python -c "from rlcfreq import data; data.fetch_all(verbose=True)"
      - run: RLCFREQ_NETWORK=1 pytest -q
